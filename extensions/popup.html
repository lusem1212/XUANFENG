<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=380">
  <title>工作站同步</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <span>工作站同步</span>
      </div>
      <button id="settingsBtn" class="icon-btn" title="设置">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
    </header>

    <!-- Status Card -->
    <div id="statusCard" class="status-card idle">
      <div class="status-icon" id="statusIcon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9H3m9 9a9 9 0 0 1-9-9m9 9c1.66 0 3-4.03 3-9s-1.34-9-3-9m0 18c-1.66 0-3-4.03-3-9s1.34-9 3-9"/>
        </svg>
      </div>
      <div class="status-info">
        <div class="status-state" id="statusState">未连接</div>
        <div class="status-detail" id="statusDetail">请先配置坚果云账号</div>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button id="syncBtn" class="btn primary" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
        <span>同步</span>
      </button>
      <div class="btn-group">
        <button id="pushBtn" class="btn secondary" disabled title="推送到云端">↑ 推送</button>
        <button id="pullBtn" class="btn secondary" disabled title="从云端拉取">↓ 拉取</button>
      </div>
    </div>

    <!-- Sync Log -->
    <div class="log-section">
      <div class="log-title">同步记录</div>
      <div id="syncLog" class="log-list">
        <div class="log-empty">暂无同步记录</div>
      </div>
    </div>

    <!-- Settings Panel (hidden by default) -->
    <div id="settingsPanel" class="settings hidden">
      <div class="settings-header">
        <button id="backBtn" class="icon-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <span>坚果云设置</span>
      </div>

      <div class="form-group">
        <label>坚果云账号</label>
        <input type="email" id="inputUsername" placeholder="your@email.com">
      </div>

      <div class="form-group">
        <label>应用密码</label>
        <div class="input-hint">在坚果云 → 账户信息 → 安全选项 → 第三方应用授权 生成</div>
        <input type="password" id="inputPassword" placeholder="xxxx-xxxx-xxxx-xxxx">
      </div>

      <div class="form-group">
        <label>设备名称</label>
        <input type="text" id="inputDevice" placeholder="如：办公电脑 / 家里电脑">
      </div>

      <div class="form-group row">
        <label>自动同步</label>
        <label class="toggle">
          <input type="checkbox" id="inputAutoSync">
          <span class="slider"></span>
        </label>
      </div>

      <div class="form-group" id="intervalGroup" style="display:none">
        <label>同步间隔</label>
        <select id="inputInterval">
          <option value="1">每 1 分钟</option>
          <option value="3">每 3 分钟</option>
          <option value="5" selected>每 5 分钟</option>
          <option value="10">每 10 分钟</option>
          <option value="30">每 30 分钟</option>
        </select>
      </div>

      <div class="form-actions">
        <button id="testBtn" class="btn secondary">测试连接</button>
        <button id="saveBtn" class="btn primary">保存设置</button>
      </div>

      <div id="testResult" class="test-result hidden"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
